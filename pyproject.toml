[project]
name = "l2b-bench"
version = "0.1.0"
description = "The unified learn2branch benchmark: eight methods, one protocol (harness: gyozas)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # The harness. Path dependency until gyozas is published on PyPI; the
    # benchmark never reimplements harness mechanisms.
    "gyozas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/l2b_bench"]

[tool.uv.sources]
gyozas = { path = "../gyozas" }

[dependency-groups]
dev = ["pytest"]
