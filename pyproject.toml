[project]
name = "l2b-bench"
version = "0.1.0"
description = "The unified learn2branch benchmark: eight methods, one protocol (harness: gyozas)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # The harness. Path dependency until gyozas is published on PyPI; the
    # benchmark never reimplements harness mechanisms.
    "gyozas",
    "scikit-learn>=1.7.2",
    "torch",
    "torch-geometric",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/l2b_bench"]

[tool.uv.sources]
gyozas = { path = "../gyozas" }
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = ["pytest"]

[[tool.uv.index]]
url = "https://nexus.retd.edf.fr/repository/pypi-all/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
